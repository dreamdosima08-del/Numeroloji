<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çevrimdışı | Numerolojim.com.tr</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#07071A;color:#F0EEF8;font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
.wrap{max-width:400px;}
.icon{font-size:64px;margin-bottom:24px;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.6;transform:scale(1);}50%{opacity:1;transform:scale(1.1);}}
h1{font-family:'Cinzel',serif;font-size:24px;font-weight:700;background:linear-gradient(135deg,#F0C860,#D4A843);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;}
p{font-size:14px;color:#6B6890;line-height:1.7;margin-bottom:28px;}
.btn{display:inline-block;padding:13px 28px;background:linear-gradient(135deg,#D4A843,#F0C860);color:#07071A;font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;border-radius:10px;text-decoration:none;border:none;cursor:pointer;}
.cached{margin-top:20px;font-size:12px;color:#6B6890;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="icon">🌙</div>
  <h1>Çevrimdışısın</h1>
  <p>Sayıların sesi şu an ulaşamıyor. İnternet bağlantını kontrol et ve tekrar dene.</p>
  <button class="btn" onclick="window.location.reload()">Tekrar Dene</button>
  <p class="cached">Daha önce ziyaret ettiğin sayfalar önbellekten açılabilir.</p>
</div>
</body>
</html>
